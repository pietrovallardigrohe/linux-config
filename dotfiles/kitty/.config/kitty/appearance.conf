# Window appearance
# Adapted from wezterm/config/appearance.lua

# ---- cursor (BlinkingBlock, 650ms) ----
cursor_shape block
cursor_blink_interval 0.65

# ---- window padding (wezterm: left=0 right=0 top=10 bottom=7.5) ----
# order is: top right bottom left
window_padding_width 10 0 8 0

# ---- tab bar ----
tab_bar_min_tabs 1
tab_bar_style powerline
tab_bar_background        #11111b
active_tab_foreground     #cdd6f4
active_tab_background     #585b70
inactive_tab_foreground   #bac2de
inactive_tab_background   #313244

# ---- window borders (replaces wezterm inactive_pane_hsb dimming) ----
active_border_color     #b4befe
inactive_border_color   #313244

# ---- background (wezterm backdrops) ----
# wezterm overlays a color layer at opacity 0.96 on top of the image;
# kitty background_tint blends the image toward `background` with the same effect.
background_image backdrops/frieren.jpeg
background_image_layout scaled
background_tint 0.96
# NOTE: kitty cannot cycle/randomize backgrounds at runtime like wezterm's
# backdrops module. Edit the path above, or delete these three lines to
# use a plain `background` color.
