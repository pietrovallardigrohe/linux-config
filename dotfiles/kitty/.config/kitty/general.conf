# General behaviours
# Adapted from wezterm/config/general.lua

# scrollback (wezterm: scrollback_lines = 20000)
scrollback_lines 20000

# shell (wezterm uses a login zsh)
shell /usr/bin/zsh
shell_integration enabled

# audible bell disabled (wezterm: audible_bell = 'Disabled')
visual_bell_duration 0.0
