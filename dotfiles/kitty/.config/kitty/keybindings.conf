# Keybindings
# Adapted from wezterm/config/bindings.lua (Linux: SUPER = alt, SUPER_REV = ctrl+alt)
# kitty has no multi-key leader tables (wezterm's ctrl+alt+Space) so those
# are mapped to direct keybindings instead.

# ---- misc ----
map f1 show_scrollback
map f2 kitten command_palette
# f3 launcher / f5 workspaces -> no kitty equivalent
map f11 toggle_fullscreen
map f12 debug_config
map ctrl+alt+u kitten hints --type url

# ---- cursor movement (send raw escape sequences) ----
map alt+left send_text \x1bOH
map alt+right send_text \x1bOF
map alt+backspace send_text \x15

# ---- copy/paste ----
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n send_text \u2660
map ctrl+shift+s send_text \u203d

# ---- tabs ----
map alt+t new_tab
map alt+w close_window
map ctrl+alt+w close_tab
map alt+[ previous_tab
map alt+] next_tab
map ctrl+alt+[ move_tab_backward
map ctrl+alt+] move_tab_forward
map alt+0 set_tab_title
# ctrl+alt+0 reset tab title -> no kitty equivalent
map alt+9 toggle_tab_bar

# ---- windows ----
map alt+n new_os_window
map alt+enter toggle_layout zoom
map ctrl+alt+enter toggle_maximize

# ---- panes (kitty calls them windows) ----
map alt+\ split_window --location right
map ctrl+alt+\ split_window --location bottom
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
# ctrl+alt+p pane selector -> no kitty equivalent

# ---- scrolling ----
map alt+u scroll_line_up 5
map alt+d scroll_line_down 5
map page_up scroll_page_up
map page_down scroll_page_down

# ---- font size (wezterm leader->f, then k/j/r) ----
map alt+equal increase_font_size
map alt+minus decrease_font_size
map alt+r reset_font_size

# ---- resize panes (wezterm leader->p, then h/j/k/l) ----
map ctrl+alt+space start_resizing_windows
